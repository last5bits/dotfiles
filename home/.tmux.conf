# Airline-like status line
# source ~/.tmux/tmux-gray.tmuxtheme

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

set-window-option -g mode-keys vi

set -g default-terminal "tmux-256color"
set-option -a terminal-features "xterm-256color:RGB"
setw -g xterm-keys on
set-option -g allow-passthrough on

# Mouse support is on
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Key bindings
bind e command-prompt -I "new-session -s "
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Reset the current window back to auto-renaming after a manual rename.
bind . set-window-option automatic-rename on

# Automatically renumber window numbers on closing a pane (tmux >= 1.7).
set -g renumber-windows on

# Needed by vim-gitgutter
set -g focus-events on

# Needed to eliminate the delay in NeoVim
set-option -sg escape-time 10

# Plugins
run-shell ~/.tmux/plugins/tmux-sensible/sensible.tmux
run-shell ~/.tmux/plugins/tmux-yank/yank.tmux
run-shell ~/.tmux/plugins/tmux-cpu/cpu.tmux

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_date_time_text " %H:%M:%S %d-%b-%y"

# Auto-rename windows to the current command (e.g., vim, zsh), but still
# allow manual renaming with Prefix + ,.  Tmux disables automatic-rename
# for a window when you rename it manually.
setw -g automatic-rename on
set -g allow-rename on

# Use #W (window name) instead of #T (pane title, which defaults to
# user@host:path) so the catppuccin theme shows the application name.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Combine user@host into the host module (single icon) instead of separate
# user and host modules on the right status.
set -g @catppuccin_host_text " #(whoami)@#H"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"
