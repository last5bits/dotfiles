# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

set-window-option -g mode-keys vi

set -g default-terminal "tmux-256color"
set-option -a terminal-features "xterm-256color:RGB"
set-option -a terminal-features "ghostty:clipboard:RGB"
set-option -g allow-passthrough on
set -g set-clipboard on

# Mouse support is on
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Key bindings
bind e command-prompt -I "new-session -s "
bind C-p previous-window
bind C-n next-window
bind Escape copy-mode

# Copy-mode vi bindings (inlined from tmux-sensible)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi H send-keys -X top-line
bind-key -T copy-mode-vi M send-keys -X middle-line
bind-key -T copy-mode-vi L send-keys -X bottom-line

# Keep mouse selection highlighted after releasing the button
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Automatically renumber window numbers on closing a pane (tmux >= 1.7).
set -g renumber-windows on

# Needed to eliminate the delay in NeoVim
set-option -sg escape-time 10

# ── Options (inlined from tmux-sensible) ─────────────────────────
set -g history-limit 50000
set -g aggressive-resize on
set -g set-titles on
set -g status-keys vi

# ── TPM Plugins ──────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# ── Standalone Catppuccin Theme ──
# Auto-rename windows to the current command (e.g., vim, zsh), but still
# allow manual renaming with Prefix + ,.  Tmux disables automatic-rename
# for a window when you rename it manually.
setw -g automatic-rename on
set -g allow-rename on

# Reset the current window back to auto-renaming after a manual rename.
bind . set-window-option automatic-rename on

# Theme file (inlined from catppuccin/tmux to remove submodule dependency)
source ~/.tmux/tmux-catppuccin.tmuxtheme

# ── TPM Bootstrap ────────────────────────────────────────────────
# Install TPM and plugins automatically on first launch
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
